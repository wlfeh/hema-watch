name: HEMA stock watch

on:
  schedule:
    - cron: "17 7,10,13,16 * * *"   # 4x a day, times are UTC
  workflow_dispatch:              # lets you start it by hand from the Actions tab
    inputs:
      test_notification:
        description: "Send a test notification instead of checking stock"
        type: boolean
        default: false

permissions:
  actions: write    # lets the workflow switch itself off at the end date
  contents: read

env:
  END_DATE: "2026-12-01"   # the watcher stops on this date (UTC), format YYYY-MM-DD

concurrency:
  group: hema-watch
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      expired: ${{ steps.date.outputs.expired }}
    steps:
      - id: date
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          today=$(date -u +%F)
          if [[ "$today" < "$END_DATE" ]]; then
            echo "expired=false" >> "$GITHUB_OUTPUT"
          else
            echo "expired=true" >> "$GITHUB_OUTPUT"
            curl -s -H "Title: HEMA watcher stopped" \
              -d "End date $END_DATE reached. The watcher has switched itself off." \
              "https://ntfy.sh/$NTFY_TOPIC" || true
            gh workflow disable "${{ github.workflow }}" || true
          fi

  check:
    needs: gate
    if: needs.gate.outputs.expired != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Restore last known stock
        uses: actions/cache/restore@v4
        with:
          path: hema_state.json
          key: hema-state-${{ github.run_id }}
          restore-keys: hema-state-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python hema_watch.py ${{ inputs.test_notification && '--test-notify' || '' }}

      - name: Save last known stock
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hema_state.json
          key: hema-state-${{ github.run_id }}
